version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
# pip is intentionally not listed: requirements.txt only declares `>=` floors, so
# installs already resolve to the latest releases; version-update PRs would only
# raise floors, which would drop support the code does not need to drop. Aged floors are
# reviewed monthly by .github/workflows/dependency-freshness.yml instead.
